<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | ระบบงานกิจกรรมพัฒนานักศึกษาคณะวิทยาศาสตร์</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css')}}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='sci_atomic.png') }}">
</head>

<body class="bg-light">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center px-0">
        <div class="row w-100">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4 mx-auto">

                <div class="card shadow-lg rounded-4 p-4 login-card">
                    <a href="{{ url_for('index') }}"
                        class="btn btn-light position-absolute top-0 start-0 m-3 shadow-sm">
                        <i class="bi bi-arrow-left"></i>
                    </a>

                    <div class="text-center mb-4">
                        <img src="{{ url_for('static', filename='sci_atomic.png') }}" width="100"
                            class="img-fluid mb-3">
                        <h4 class="fw-semibold mb-1 system-title">
                            ระบบงานกิจกรรมพัฒนานักศึกษา
                        </h4>
                        <small class="text-muted">
                            คณะวิทยาศาสตร์
                        </small>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">ชื่อผู้ใช้งานอีเมล/รหัสนักศึกษา</label>
                            <input type="text" name="identifier" class="form-control" placeholder="Username"
                                value="{{ identifier }}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">รหัสผ่าน</label>

                            <div class="position-relative">
                                <input type="password" name="password" id="password" class="form-control pe-5"
                                    placeholder="Password" required>

                                <i class="bi bi-eye-slash position-absolute" style="top:50%; right:15px; transform:translateY(-50%);
                                          cursor:pointer; font-size:14px;" onclick="togglePassword('password', this)">
                                </i>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            เข้าสู่ระบบ
                        </button>

                        {% if error %}
                        <div class="alert alert-danger mt-3 text-center">
                            {{ error }}
                        </div>
                        {% endif %}
                    </form>

                    <div class="text-center mt-4">
                        <small>
                            ยังไม่ลงทะเบียน?
                            <a href="{{ url_for('auth.register') }}" class="text-decoration-none ">
                                ลงทะเบียนที่นี่
                            </a>
                        </small>
                    </div>

                </div>

            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
