<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/sciicon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark shadow">
        <div class="container">
            <a class="navbar-brand" href="/admin/dashboard">
                <i class="bi bi-shield-lock-fill me-2"></i>Admin Panel
            </a>

            <!-- Admin Profile Dropdown -->
            <div class="dropdown">
                <button class="btn text-white p-0" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle" style="font-size: 1.8rem;"></i>
                </button>

                <ul class="dropdown-menu dropdown-menu-end shadow border-0 p-3 mt-3 profile-dropdown">

                    <!-- Admin Icon -->
                    <li class="text-center mb-2">
                        <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem;"></i>
                    </li>

                    <!-- Admin ID -->
                    <li class="text-center small text-muted">
                        Admin ID: {{ session.get('admin_id') }}
                    </li>

                    <!-- Role -->
                    <li class="text-center fw-semibold mb-2 text-primary">
                        ผู้ดูแลระบบ
                    </li>

                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <!-- Logout -->
                    <li>
                        <form action="{{ url_for('admin.admin_logout') }}" method="GET" class="m-0">
                            <button type="submit" class="dropdown-item logout-btn text-danger">
                                <i class="bi bi-box-arrow-right me-2"></i> ออกจากระบบ
                            </button>
                        </form>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h3 class="fw-bold mb-4 text-center">ระบบจัดการผู้ใช้งาน</h3>

        <!-- CREATE USER CARD -->
        <div class="card shadow p-4 mb-5">
            <h5 class="mb-4 fw-semibold">
                <i class="bi bi-person-plus-fill text-success"></i> สร้างผู้ใช้ใหม่
            </h5>

            <form id="userForm" class="row g-3">

                <div class="col-md-3">
                    <select class="form-select" id="role" required>
                        <option value="">เลือกประเภท</option>
                        <option value="officer">เจ้าหน้าที่</option>
                        <option value="club">สโมสรนักศึกษา</option>
                        <option value="student">นักศึกษา</option>
                    </select>
                </div>

                <div id="dynamicFields" class="row g-3"></div>

                <div class="col-12">
                    <button class="btn btn-success btn-pill px-4">
                        <i class="bi bi-plus-circle"></i> สร้างผู้ใช้
                    </button>
                </div>

            </form>
        </div>

        <!-- ROLE FILTER BUTTONS -->
        <div class="d-flex flex-wrap gap-3 mb-4 justify-content-center">

            <button class="btn btn-outline-danger px-4 py-2 rounded-pill role-btn" onclick="loadUsers('officer', this)">
                <i class="bi bi-person-badge"></i> เจ้าหน้าที่
            </button>

            <button class="btn btn-outline-warning px-4 py-2 rounded-pill role-btn" onclick="loadUsers('club', this)">
                <i class="bi bi-people-fill"></i> สโมสรนักศึกษา
            </button>

            <button class="btn btn-outline-primary px-4 py-2 rounded-pill role-btn"
                onclick="loadUsers('student', this)">
                <i class="bi bi-mortarboard-fill"></i> นักศึกษา
            </button>

        </div>

        <!-- TABLE -->
        <div class="table-wrapper shadow">
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center mb-0" id="userTable">
                    <thead>
                        <tr>
                            <th>รหัส</th>
                            <th>ชื่อ</th>
                            <th>คณะ</th>
                            <th>สาขา</th>
                            <th>ชั้นปี</th>
                            <th>Email</th>
                            <th>เบอร์โทร</th>
                            <th>ตำแหน่ง</th>
                            <th>เข้าใช้ล่าสุด</th>
                            <th>สร้างเมื่อ</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- EDIT STUDENT MODAL -->
        <div class="modal fade" id="editModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title">แก้ไขข้อมูลนักศึกษา</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body row g-3">

                        <input type="hidden" id="edit_student_id">

                        <div class="col-md-6">
                            <label>รหัสนักศึกษา</label>
                            <input type="text" class="form-control" id="edit_student_code">
                        </div>

                        <div class="col-md-6">
                            <label>ชื่อ</label>
                            <input type="text" class="form-control" id="edit_name">
                        </div>

                        <div class="col-md-6">
                            <label>คณะ</label>
                            <input type="text" class="form-control" id="edit_faculty">
                        </div>

                        <div class="col-md-6">
                            <label>สาขา</label>
                            <input type="text" class="form-control" id="edit_major">
                        </div>

                        <div class="col-md-4">
                            <label>ชั้นปี</label>
                            <input type="number" class="form-control" id="edit_year">
                        </div>

                        <!-- สำหรับสโมสร -->
                        <div class="col-md-4" id="edit_position_wrapper" style="display:none;">
                            <label>ตำแหน่ง</label>
                            <input type="text" class="form-control" id="edit_position">
                        </div>

                        <div class="col-md-4">
                            <label>Email</label>
                            <input type="email" class="form-control" id="edit_email">
                        </div>

                        <div class="col-md-4">
                            <label>เบอร์โทร</label>
                            <input type="text" class="form-control" id="edit_phone">
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-success" onclick="updateUser()">
                            บันทึกการแก้ไข
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- EDIT OFFICER MODAL -->
        <div class="modal fade" id="editOfficerModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title">แก้ไขข้อมูลเจ้าหน้าที่</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">

                        <input type="hidden" id="edit_officer_id">

                        <div class="mb-3">
                            <label>ชื่อ</label>
                            <input type="text" class="form-control" id="edit_officer_name">
                        </div>

                        <div class="mb-3">
                            <label>หน่วยงาน</label>
                            <input type="text" class="form-control" id="edit_officer_department">
                        </div>

                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" class="form-control" id="edit_officer_email">
                        </div>

                        <div class="mb-3">
                            <label>เบอร์โทร</label>
                            <input type="text" class="form-control" id="edit_officer_phone">
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-success" onclick="updateUser()">
                            บันทึกการแก้ไข
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>


</body>

</html>
