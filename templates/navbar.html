<style>
    .bg-ubu {
        background-color: #112592 !important;
    }

    .nav-link {
        color: white !important;
        font-size: 0.95rem;
        padding: 0 15px !important;
        transition: 0.3s;
    }

    .nav-link:hover {
        color: #ffc107 !important;
    }

    .custom-mega-menu {
        position: absolute !important;
        top: 100% !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        width: 560px !important;
        background-color: rgba(17, 37, 146, 0.95) !important;
        backdrop-filter: blur(10px);
        border-radius: 20px !important;
        padding: 20px !important;
        border: none !important;
        z-index: 1050;
    }

    .mega-menu-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .mega-menu-grid .dropdown-item {
        color: white !important;
        padding: 10px 15px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.05);
        transition: 0.2s;
        white-space: normal;
        font-size: 0.85rem;
    }

    .mega-menu-grid .dropdown-item:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #ffc107 !important;
    }

    #userRoleProfile {
        font-size: 0.9rem;
        color: #112592;
        font-weight: 600;
        display: block;
        padding: 5px 15px;
    }
</style>

<nav class="navbar navbar-expand-lg navbar-dark bg-ubu sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="{{ url_for('static', filename='sci_atomic.png') }}" height="45" class="me-2">
            <div style="line-height: 1.1;">
                <span class="fw-light" style="font-size:0.85rem">คณะวิทยาศาสตร์</span><br>
                <span class="fw-bold">Faculty of Science</span>
            </div>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-center" id="navContent">
            <ul class="navbar-nav mx-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="/news">ข่าวประชาสัมพันธ์กิจกรรม</a></li>
                <li class="nav-item"><a class="nav-link" href="/calendar">ปฏิทินกิจกรรมรวม</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">เพิ่มเติม</a>
                    <div class="dropdown-menu custom-mega-menu shadow-lg">
                        <div class="mega-menu-grid" id="megaMenuContent"></div>
                    </div>
                </li>
            </ul>
        </div>

        <div class="dropdown">
            <button class="btn text-white p-0" data-bs-toggle="dropdown">
                <i class="bi bi-person-circle" style="font-size: 1.8rem;"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" style="min-width:200px">
                {% if current_role %}
                <li><span class="dropdown-item-text fw-bold text-dark small">{{ current_user }}</span></li>
                <li><span class="dropdown-item-text text-muted small">{{
                        {'staff':'เจ้าหน้าที่','club':'นักศึกษาสโมสร','student':'นักศึกษา'}[current_role] }}</span></li>
                <li>
                    <hr class="dropdown-divider my-1">
                </li>
                <li>
                    <form action="{{ url_for('auth.logout') }}" method="POST" style="display:inline;">
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>ออกจากระบบ
                        </button>
                    </form>
                </li>
                {% else %}
                <li><a class="dropdown-item fw-bold" href="/auth/login"><i
                            class="bi bi-box-arrow-in-right me-2"></i>ลงชื่อเข้าใช้</a></li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
