<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}UBU Science Engage{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='sci_atomic.png') }}" />

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --ubu-blue: #112592;
            --ubu-yellow: #ffc107;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding-top: var(--nav-height); /* ป้องกันเนื้อหาโดน Navbar ทับ */
        }
        
        /* ===== NAVBAR ===== */
        .navbar {
            height: var(--nav-height);
            background-color: var(--ubu-blue) !important;
            border-bottom: none !important; /* เอาเส้นเหลืองออก */
            z-index: 1060;
        }
        
        .navbar-brand img { height: 45px !important; width: auto; }
        .brand-text span { color: white; display: block; line-height: 1.2; }
        .brand-text .small-text { font-size: 0.7rem; opacity: 0.9; }
        .brand-text .main-text { font-size: 0.95rem; font-weight: 600; }
        
        /* จัดกลุ่มปุ่ม Hamburger และ Profile */
        .navbar-toggler { border: none !important; padding: 0 !important; }
        .navbar-toggler:focus { box-shadow: none !important; }
        .navbar-toggler-icon { filter: invert(1) brightness(100%); width: 1.5em; height: 1.5em; } /* ไอคอนเบอร์เกอร์สีขาว */
        
        .profile-btn { font-size: 1.8rem !important; color: white; padding: 0; }
        
        /* ส่วนแสดงผลเมนู Dropdown แฮมเบอร์เกอร์ (ใช้โครงสร้างนี้กับทุกหน้าต่าง) */
        .navbar-collapse {
            background-color: rgba(17, 37, 146, 0.98);
            position: absolute;
            width: 100%;
            left: 0;
            top: var(--nav-height);
            z-index: 1050;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            backdrop-filter: blur(10px);
            border-radius: 0 0 20px 20px;
            padding: 20px;
        }
        
        /* เมนูหลัก (ข่าว, ปฏิทิน) */
        .top-nav-link {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            display: block;
            padding: 8px 15px;
            border-radius: 10px;
            transition: 0.2s;
        }
        .top-nav-link:hover { background: rgba(255,255,255,0.1); color: var(--ubu-yellow); }

        /* เมนูย่อยตามบทบาท (Grid 3 คอลัมน์) */
        .mega-menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* บังคับ 3 คอลัมน์ */
            gap: 12px;
            margin-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 20px;
        }
        
        @media (max-width: 768px) {
            .mega-menu-grid { grid-template-columns: 1fr; } /* มือถือให้เหลือ 1 คอลัมน์ */
        }
        
        .dropdown-item-custom {
            color: white !important;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: 0.2s;
        }
        .dropdown-item-custom:hover { background: var(--ubu-yellow); color: var(--ubu-blue) !important; }

        main { min-height: 85vh; padding-bottom: 3rem; }
    </style>
    {% block head %}{% endblock %}
</head>

<body>
<nav class="navbar navbar-dark bg-ubu sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/"><img src="{{ url_for('static', filename='sci_atomic.png') }}" height="45" class="me-2"><div style="line-height: 1.1;"><span class="fw-light" style="font-size:0.85rem">คณะวิทยาศาสตร์</span><br><span class="fw-bold">Faculty of Science</span></div></a>
            <div class="d-flex align-items-center">
                <button class="navbar-toggler me-3" type="button" data-bs-toggle="collapse" data-bs-target="#newsNav"><span class="navbar-toggler-icon"></span></button>
                <div class="dropdown"><button class="btn text-white p-0" data-bs-toggle="dropdown"><i class="bi bi-person-circle" style="font-size: 1.8rem;"></i></button><ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2"><li><span id="userRoleProfile" class="dropdown-item-text border-bottom mb-1">บทบาท</span></li><li><a class="dropdown-item text-danger" href="#"><i class="bi bi-box-arrow-right me-2"></i>ออกจากระบบ</a></li></ul></div>
            </div>
            <div class="collapse navbar-collapse mt-2" id="newsNav"><div id="expandedFunctions" class="menu-grid"></div></div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/calendar.js') }}"></script>

    <script>
        document.addEventListener('click', function (e) {
            const collapseEl = document.getElementById('navContent');
            const togglerBtn = document.querySelector('.navbar-toggler');
            
            if (collapseEl && collapseEl.classList.contains('show')) {
                if (!collapseEl.contains(e.target) && !togglerBtn.contains(e.target)) {
                    const bsCollapse = bootstrap.Collapse.getInstance(collapseEl);
                    if (bsCollapse) bsCollapse.hide();
                }
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
